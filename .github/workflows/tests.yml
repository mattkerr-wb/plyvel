name: plyvel test

on:
  # Triggers the workflow on push to the main branch
  push:
    branches: [CI]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  wheel:
    name: Build ${{ matrix.name }} wheels
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # This line fixes the softprops action error
    strategy:
      matrix:
        include:
          - os: macos-15
            name: macos-15
            cibw:
              platform: macos
              arch: universal2
              build: "cp311-* cp312-* cp314-*"
              version: 15.0
          - os: macos-26
            name: macos-26
            cibw:
              platform: macos
              arch: universal2
              build: "cp311-* cp312-* cp314-*"
              version: 26.0
          - os: ubuntu-24.04
            name: linux
            cibw:
              platform: linux
              # auto = x86_64, usually WSL2 users
              arch: auto aarch64
              build: "cp311-* cp312-* cp314-*"
    env:
      CIBW_BUILD: "${{ matrix.cibw.build || '*' }}"
      CIBW_PLATFORM: "${{ matrix.cibw.platform || '' }}"
      # `CPLUS_INCLUDE_PATH` and `LIBRARY_PATH` for `setup.py` to link leveldb and snappy headers and libs in macOS
      CIBW_ENVIRONMENT_MACOS: >
        C_INCLUDE_PATH="/usr/local/include:$C_INCLUDE_PATH"
        CPLUS_INCLUDE_PATH="/usr/local/include:$CPLUS_INCLUDE_PATH"
        LIBRARY_PATH="/usr/local/lib:$LIBRARY_PATH"
      CIBW_BEFORE_ALL_LINUX:  "gcc -v \
                              && bash scripts/install-snappy.sh \
                              && bash scripts/install-leveldb.sh"
      CIBW_BEFORE_ALL_MACOS:  "clang -v \
                              && bash scripts/install-snappy.sh \
                              && bash scripts/install-leveldb.sh"
      CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair --lib-sdir . -w {dest_dir} {wheel}"
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: "delocate-listdeps {wheel} && delocate-wheel -w {dest_dir} {wheel} -v"
      CIBW_TEST_REQUIRES: "pytest"
      CIBW_TEST_COMMAND: "pytest -v {package}/test"
      MACOSX_DEPLOYMENT_TARGET: "${{ matrix.cibw.version }}"
      CIBW_CACHE_PATH: "${{ runner.temp }}/cibw-cache"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv with Python 311
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: matrix.cibw.build == 'cp311-*'
        with:
          version: 0.11.8
          python-version: 3.11
          activate-environment: true
          enable-cache: true
          cache-suffix: cp311
          cache-python: true
          download-from-astral-mirror: false

      - name: Install uv with Python 312
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: matrix.cibw.build == 'cp312-*'
        with:
          version: 0.11.8
          python-version: 3.12
          activate-environment: true
          enable-cache: true
          cache-suffix: cp312
          cache-python: true
          download-from-astral-mirror: false

      - name: Install uv with Python 314
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: matrix.cibw.build == 'cp314-*'
        with:
          version: 0.11.8
          python-version: 3.14
          activate-environment: true
          enable-cache: true
          cache-suffix: cp314
          cache-python: true
          download-from-astral-mirror: false

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ runner.os }}-${{ matrix.cibw.build}}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibw-${{ runner.os }}-${{ matrix.cibw.build }}

      - uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: wheelhouse

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl

