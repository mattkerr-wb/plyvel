[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plyvel-wb"
version = "1.5.1"
description = "Plyvel, a fast and feature-rich Python interface to LevelDB, with pre-build wheels."
readme = "README.md"
authors = [
  { name = "Wouter Bolsterlee", email = "wouter@bolsterl.ee" },
  { name = "Matt Kerr", email = "matt.kerr@wbgames.com"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: C++",
  "Programming Language :: Cython",
  "Programming Language :: Python",
  "Programming Language :: Python :: 2",
  "Programming Language :: Python :: 3",
  "Topic :: DatabaseTopic :: Database :: Database Engines/Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11,<3.12"
dependencies = [
  "cibuildwheel>=4.0.0",
  "Cython>=3.2",
  "humanize==4.16.0",
  "packaging>=26.0.0",
  "bashlex==0.18",
  "dependency_groups>=1.3.0",
  "bracex>=3.0.0",
  "build>=1.5.0",
  "pyproject-hooks>=1.2.0",
  "filelock>=3.32.0",
  "certifi",
  "platformdirs>=4.11.0",
  "sphinx>=8.0.0",
  "pytest>=9.1.0",
  "pytest-cov>=7.1.0",
  "setuptools>=75",
]

# ensures that leveldb, snappy, and wheelhouse outputs aren't picked up
[tool.setuptools]
packages = ["plyvel"]

[project.urls]
Homepage = "https://github.com/mattkerr-wb/plyvel"

###
# UV
###
[tool.uv]
# different uv versions could have different lockfile formats and if developers don't all have the same version
# the lock file is going to flip/flop back and forth
# if we choose to bump the requirement, we should also update it in other repos to simplify our lives (e.g. supervisor, hydra-release)
required-version = ">=0.11.8,<0.12.0"
# ensures any unpinned dependencies are older than 7 days to avoid potentially malicious recent published packages from appearing in our builds/local machines
exclude-newer = "7 days"
# We need to use link-mode "symlink" because we're installing editable components from the host volume into the
# virtual environment that lives inside the container's filesystem
link-mode = "symlink"
# setuptools editable installs must use compat mode so mypy can resolve hydralibs (see mypy #13392)
config-settings = { editable_mode = "compat" }
environments = [
  "platform_system == 'darwin'",
  "platform_system == 'linux' and platform_machine == 'aarch64'",
  "platform_system == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.extra-build-dependencies]
plyvel-wb = ["Cython"]

[tool.cibuildwheel]
before-build = "scripts/cibuildwheel-before-build.sh"
build = "cp311-* cp312-* cp314-*"
build-frontend = { name="build[uv]", args="" }

[tool.cibuildwheel.macos]
environment = "MACOSX_DEPLOYMENT_TARGET=15.0"
